name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  go:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal tools api)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Validate OpenAPI document and examples
        run: go run github.com/getkin/kin-openapi/cmd/validate@v0.133.0 -- api/openapi.json
      - name: Check generated API types
        run: |
          go generate ./api
          git diff --exit-code -- internal/adapters/inbound/openai/types.gen.go
      - run: go vet ./...
      - run: go test ./...
      - name: Fuzz Copilot framing and authentication
        if: runner.os == 'Linux'
        run: |
          for target in FuzzFrameLength FuzzGuardedFrames FuzzBridgeAuthentication; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=10s -parallel=2 ./internal/adapters/outbound/copilot
          done
      - name: Save discovered fuzz regressions
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: copilot-fuzz-regressions
          path: internal/adapters/outbound/copilot/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 7
      - name: Repeat Windows launcher integration
        if: runner.os == 'Windows'
        run: go test -count=5 -timeout=3m ./internal/process
      - name: Test Windows batch entry points
        if: runner.os == 'Windows'
        run: |
          for extension in .cmd .bat; do
            HARNESS_GATEWAY_TEST_CLI_WRAPPER="$extension" go test -count=1 ./cmd/harness-gateway ./internal/adapters/outbound/codex ./internal/adapters/outbound/copilot
          done
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -p 1 ./...
      - run: go build ./...

  systemd-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Test a real systemd user service in a disposable account
        run: bash tools/systemd/ci.sh
      - name: Retain service lifecycle and journal diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: systemd-user-service
          path: |
            ${{ runner.temp }}/systemd-service.log
            ${{ runner.temp }}/systemd-service-journal.log
          if-no-files-found: warn
          retention-days: 14

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  installed-clis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      HARNESS_GATEWAY_TEST_INSTALLED_CLIS: '1'
      HARNESS_GATEWAY_TEST_CODEX_VERSION: '0.167.0'
      HARNESS_GATEWAY_TEST_COPILOT_VERSION: '1.0.105'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Install pinned public CLI packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'Harness CLI tools'
          npm.cmd install --global --prefix $prefix "@openai/codex@$env:HARNESS_GATEWAY_TEST_CODEX_VERSION" "@github/copilot@$env:HARNESS_GATEWAY_TEST_COPILOT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned public CLI packages on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/Harness CLI tools"
          npm install --global --prefix "$prefix" "@openai/codex@$HARNESS_GATEWAY_TEST_CODEX_VERSION" "@github/copilot@$HARNESS_GATEWAY_TEST_COPILOT_VERSION"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - name: Test real launchers, handshakes, and isolated session storage
        shell: bash
        run: go test -v -count=1 -timeout=3m -run '^TestInstalledCLI' ./cmd/harness-gateway ./internal/adapters/outbound/codex ./internal/adapters/outbound/copilot

  spring-ai-acceptance:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: examples/spring-ai/pom.xml
      - name: Install the gateway into a private directory
        run: GOBIN="$RUNNER_TEMP/gateway-install" go install ./cmd/harness-gateway
      - name: Run Spring Boot acceptance against the installed gateway
        run: go run ./tools/acceptance --gateway-binary "$RUNNER_TEMP/gateway-install/harness-gateway" --output-dir examples/spring-ai/target/acceptance-logs --soak=${{ runner.os == 'Linux' && '45s' || '0s' }}
      - name: Save Spring AI reports and gateway diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spring-ai-acceptance-${{ matrix.os }}
          path: |
            examples/spring-ai/target/acceptance-logs/
            examples/spring-ai/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/browser
      - name: Install browser
        # The hosted Ubuntu runner already provides Chromium's shared libraries.
        run: npx playwright install --only-shell chromium
        timeout-minutes: 5
        working-directory: tools/browser
      - name: Test Scalar against Go CLI fixtures
        run: npm test
        working-directory: tools/browser
        timeout-minutes: 3
        env:
          HARNESS_GATEWAY_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/harness-gateway-browser-output
      - name: Save browser test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scalar-browser-acceptance
          path: ${{ runner.temp }}/harness-gateway-browser-output
          if-no-files-found: ignore
          retention-days: 7
